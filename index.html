<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geometry AI AR</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef6ff;
    color: #17324d;
    text-align: center;
}

h1 {
    color: #1565c0;
}

button {
    padding: 14px 20px;
    margin: 7px;
    border: 0;
    border-radius: 12px;
    background: #1976d2;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.camera {
    width: 95%;
    max-width: 700px;
    margin: auto;
    background: #111;
    border-radius: 20px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
}

.info {
    background: white;
    width: 90%;
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 18px;
}

select {
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
}

.quiz {
    background: white;
    width: 90%;
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 18px;
}
</style>
</head>

<body>

<h1>📐 GEOMETRY AI AR</h1>

<p>Halakan kamera kepada objek di sekeliling anda.</p>

<div class="camera">

    <video id="camera" autoplay playsinline></video>

</div>

<button id="startCamera">
📷 Mula Kamera
</button>

<div class="info">

    <h2>🔎 Bentuk Dikesan</h2>

    <select id="shape">

        <option value="kuboid">📦 Kuboid</option>
        <option value="kubus">🧊 Kubus</option>
        <option value="silinder">🥫 Silinder</option>
        <option value="sfera">⚽ Sfera</option>
        <option value="piramid">🔺 Piramid</option>

    </select>

    <button onclick="showInfo()">
        Lihat Maklumat
    </button>

    <div id="result">

        <p>Pilih bentuk untuk melihat maklumat.</p>

    </div>

</div>

<div class="quiz">

    <h2>📝 Kuiz</h2>

    <p>
        Apakah bentuk 3D yang mempunyai
        <b>6 sisi, 8 bucu dan 12 rusuk</b>?
    </p>

    <button onclick="answer(false)">
        A. Silinder
    </button>

    <button onclick="answer(true)">
        B. Kuboid
    </button>

    <button onclick="answer(false)">
        C. Sfera
    </button>

    <button onclick="answer(false)">
        D. Piramid
    </button>

    <p id="quizResult"></p>

</div>

<script>

const video = document.getElementById("camera");

document.getElementById("startCamera")
.addEventListener("click", async function() {

    try {

        const stream =
        await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                }
            },
            audio: false
        });

        video.srcObject = stream;

    } catch (error) {

        alert(
            "Kamera tidak dapat dibuka. Pastikan anda menggunakan HTTPS dan benarkan akses kamera."
        );

    }

});


function showInfo() {

    const shape =
    document.getElementById("shape").value;

    const result =
    document.getElementById("result");

    let html = "";

    if (shape === "kuboid") {

        html = `
        <h2>📦 KUBOID</h2>
        <p>🔵 Sisi: <b>6</b></p>
        <p>🟢 Bucu: <b>8</b></p>
        <p>🟠 Rusuk: <b>12</b></p>
        <p>Setiap muka berbentuk segi empat tepat.</p>
        `;

    }

    if (shape === "kubus") {

        html = `
        <h2>🧊 KUBUS</h2>
        <p>🔵 Sisi: <b>6</b></p>
        <p>🟢 Bucu: <b>8</b></p>
        <p>🟠 Rusuk: <b>12</b></p>
        <p>Semua sisinya berbentuk segi empat sama.</p>
        `;

    }

    if (shape === "silinder") {

        html = `
        <h2>🥫 SILINDER</h2>
        <p>🔵 Sisi: <b>3</b></p>
        <p>🟢 Bucu: <b>0</b></p>
        <p>🟠 Rusuk: <b>2</b></p>
        <p>Mempunyai dua permukaan bulat.</p>
        `;

    }

    if (shape === "sfera") {

        html = `
        <h2>⚽ SFERA</h2>
        <p>🔵 Sisi: <b>1</b></p>
        <p>🟢 Bucu: <b>0</b></p>
        <p>🟠 Rusuk: <b>0</b></p>
        <p>Permukaannya melengkung.</p>
        `;

    }

    if (shape === "piramid") {

        html = `
        <h2>🔺 PIRAMID</h2>
        <p>🔵 Sisi: <b>5</b></p>
        <p>🟢 Bucu: <b>5</b></p>
        <p>🟠 Rusuk: <b>8</b></p>
        <p>Mempunyai satu tapak dan sisi berbentuk segi tiga.</p>
        `;

    }

    result.innerHTML = html;

}


function answer(correct) {

    const output =
    document.getElementById("quizResult");

    if (correct) {

        output.innerHTML =
        "🎉 Betul! Jawapannya ialah KUBOID.";

        output.style.color = "green";

    } else {

        output.innerHTML =
        "❌ Cuba lagi.";

        output.style.color = "red";

    }

}

</script>

</body>
</html>
