<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geometry AR - Kuboid</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef6ff;
    color:#17324d;
    text-align:center;
}

h1{
    color:#1565c0;
}

#cameraBox{
    position:relative;
    width:95%;
    max-width:700px;
    margin:auto;
    background:#111;
    border-radius:20px;
    overflow:hidden;
}

#video{
    width:100%;
    display:block;
}

#arCanvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

button{
    padding:14px 20px;
    margin:8px;
    border:0;
    border-radius:12px;
    background:#1976d2;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:active{
    transform:scale(.97);
}

.info{
    width:90%;
    max-width:600px;
    margin:20px auto;
    padding:20px;
    background:white;
    border-radius:18px;
}

.big{
    font-size:24px;
    font-weight:bold;
    color:#1565c0;
}

.quiz{
    width:90%;
    max-width:600px;
    margin:20px auto;
    padding:20px;
    background:white;
    border-radius:18px;
}
</style>
</head>

<body>

<h1>📐 GEOMETRY AR</h1>

<p>📦 Kenali Kuboid</p>

<div id="cameraBox">

    <video id="video"
           autoplay
           playsinline
           muted></video>

    <canvas id="arCanvas"></canvas>

</div>

<button id="startCamera">
📷 MULA KAMERA
</button>

<button id="showCube">
📦 PAPAR KUBOID 3D
</button>

<div class="info">

    <h2>🔎 Bentuk Dikesan</h2>

    <div id="shape">
        Belum dikesan
    </div>

    <div id="details">
        Halakan kamera kepada objek berbentuk kotak.
    </div>

</div>


<div class="quiz">

<h2>📝 SOALAN</h2>

<p>
<b>Soalan 1:</b><br>
Berapakah bilangan sisi pada kuboid?
</p>

<button onclick="answer(4)">
A. 4
</button>

<button onclick="answer(6)">
B. 6
</button>

<button onclick="answer(8)">
C. 8
</button>

<button onclick="answer(12)">
D. 12
</button>

<h3 id="result"></h3>

</div>


<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("arCanvas");

const ctx =
canvas.getContext("2d");


/* =========================
   KAMERA
========================= */

document
.getElementById("startCamera")
.addEventListener("click", async function(){

    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                }
            },

            audio:false

        });

        video.srcObject=stream;

        video.onloadedmetadata=function(){

            canvas.width=
            video.videoWidth;

            canvas.height=
            video.videoHeight;

        };

    }

    catch(error){

        alert(
        "Kamera tidak dapat dibuka. Sila benarkan akses kamera."
        );

    }

});


/* =========================
   KUBOID 3D
========================= */

let cubeVisible=false;

document
.getElementById("showCube")
.addEventListener("click",function(){

    cubeVisible=!cubeVisible;

    if(cubeVisible){

        document
        .getElementById("shape")
        .innerHTML=
        '<div class="big">📦 KUBOID</div>';

        document
        .getElementById("details")
        .innerHTML=`

        <p>🔵 Sisi: <b>6</b></p>

        <p>🟢 Bucu: <b>8</b></p>

        <p>🟠 Rusuk: <b>12</b></p>

        <p>📐 Muka berbentuk segi empat tepat.</p>

        `;

        drawCube();

    }

    else{

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

});


/* =========================
   PAPAR KUBOID
========================= */

function drawCube(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const w=canvas.width;

    const h=canvas.height;

    const cx=w/2;

    const cy=h/2;

    const size=
    Math.min(w,h)*0.22;


    ctx.lineWidth=5;

    ctx.strokeStyle="#00ff88";

    ctx.fillStyle=
    "rgba(0,150,255,0.30)";


    /*
       DEPAN
    */

    ctx.beginPath();

    ctx.moveTo(cx-size,cy-size);

    ctx.lineTo(cx+size,cy-size);

    ctx.lineTo(cx+size,cy+size);

    ctx.lineTo(cx-size,cy+size);

    ctx.closePath();

    ctx.fill();

    ctx.stroke();


    /*
       BELAKANG
    */

    const offset=size*0.45;

    ctx.beginPath();

    ctx.moveTo(
        cx-size+offset,
        cy-size-offset
    );

    ctx.lineTo(
        cx+size+offset,
        cy-size-offset
    );

    ctx.lineTo(
        cx+size+offset,
        cy+size-offset
    );

    ctx.lineTo(
        cx-size+offset,
        cy+size-offset
    );

    ctx.closePath();

    ctx.stroke();


    /*
       SAMBUNGAN
    */

    const points=[

        [-size,-size],

        [size,-size],

        [size,size],

        [-size,size]

    ];


    points.forEach(function(p){

        ctx.beginPath();

        ctx.moveTo(
            cx+p[0],
            cy+p[1]
        );

        ctx.lineTo(
            cx+p[0]+offset,
            cy+p[1]-offset
        );

        ctx.stroke();

    });


    /*
       LABEL
    */

    ctx.fillStyle="#ffffff";

    ctx.font="bold 22px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "KUBOID",
        cx,
        cy+8
    );

}


/* =========================
   KUIZ
========================= */

function answer(value){

    const result =
    document.getElementById("result");

    if(value===6){

        result.innerHTML=
        "🎉 BETUL! Kuboid mempunyai 6 sisi.";

        result.style.color="green";

    }

    else{

        result.innerHTML=
        "❌ Salah. Cuba lagi.";

        result.style.color="red";

    }

}

</script>

</body>
</html>
