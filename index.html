<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry AR</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef6ff;
      text-align: center;
    }

    h1 {
      color: #174a7e;
    }

    #scene {
      width: 100%;
      height: 400px;
      background: #222;
      display: block;
    }

    button {
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #info {
      background: white;
      margin: 15px;
      padding: 20px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <h1>📐 Geometry AR</h1>

  <p>Kenali Bentuk Kuboid</p>

  <canvas id="scene"></canvas>

  <button onclick="tukarMaklumat()">👆 Tekan Kuboid</button>

  <div id="info">
    <h2>📦 Kuboid</h2>
    <p>Tekan butang untuk mengetahui maklumat.</p>
  </div>

  <script>

    function tukarMaklumat() {

      document.getElementById("info").innerHTML = `
        <h2>📦 KUBOID</h2>
        <p>🔵 Bilangan sisi: <b>6</b></p>
        <p>🟢 Bilangan bucu: <b>8</b></p>
        <p>🟠 Bilangan rusuk: <b>12</b></p>
        <p>📐 Muka kuboid berbentuk segi empat tepat.</p>
      `;

    }

  </script>

</body>
</html>
