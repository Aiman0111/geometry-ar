<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geometry AR</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

h1 {
    margin: 12px;
}

#cameraBox {
    position: relative;
    width: 95%;
    max-width: 700px;
    margin: auto;
    overflow: hidden;
    border-radius: 15px;
}

video {
    width: 100%;
    display: block;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
}

#info {
    margin: 15px auto;
    width: 90%;
    max-width: 600px;
    padding: 15px;
    background: #222;
    border-radius: 12px;
}

button {
    padding: 12px 20px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>📐 Geometry AR</h1>

<div id="cameraBox">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<div id="info">
    <h2 id="shapeName">Mencari objek...</h2>
    <p id="instruction">
        Halakan kamera kepada objek.
    </p>
</div>

<button onclick="resetRotation()">🔄 Reset Putaran</button>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let model;

let currentShape = null;
let currentBox = null;

let rotationX = 0;
let rotationY = 0;

let dragging = false;
let lastX = 0;
let lastY = 0;


// ===============================
// CAMERA
// ===============================

async function startCamera() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                }
            },
            audio: false
        });

        video.srcObject = stream;

        await video.play();

        resizeCanvas();

        model = await cocoSsd.load();

        detectObjects();

    } catch(error) {

        alert("Kamera tidak dapat dibuka: " + error);

    }

}


// ===============================
// CANVAS
// ===============================

function resizeCanvas() {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

}

video.addEventListener("loadedmetadata", resizeCanvas);


// ===============================
// DETECT OBJECT
// ===============================

async function detectObjects() {

    if (!model) return;

    const predictions = await model.detect(video);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (predictions.length > 0) {

        const object = predictions[0];

        const shape = getShape(object.class);

        if (shape) {

            currentShape = shape;
            currentBox = object.bbox;

            drawARShape(object.bbox, shape);

            showInfo(shape, object.score);

        }

    }

    requestAnimationFrame(detectObjects);

}


// ===============================
// TUKAR OBJEK → BENTUK GEOMETRI
// ===============================

function getShape(object) {

    if (
        object === "bottle" ||
        object === "cup" ||
        object === "wine glass" ||
        object === "vase"
    ) {
        return "SILINDER";
    }

    if (object === "sports ball") {
        return "SFERA";
    }

    if (
        object === "book" ||
        object === "laptop" ||
        object === "keyboard" ||
        object === "cell phone" ||
        object === "remote"
    ) {
        return "KUBOID";
    }

    return null;

}


// ===============================
// MAKLUMAT BENTUK
// ===============================

function showInfo(shape, score) {

    document.getElementById("shapeName").innerText =
        "Bentuk: " + shape;

    document.getElementById("instruction").innerText =
        "👆 Tarik objek dengan jari untuk memutarkannya • Keyakinan: "
        + Math.round(score * 100) + "%";

}


// ===============================
// LUKIS OBJEK
// ===============================

function drawARShape(box, shape) {

    const x = box[0];
    const y = box[1];

    const w = box[2];
    const h = box[3];

    const cx = x + w / 2;
    const cy = y + h / 2;

    // bounding box
    ctx.strokeStyle = "#00ff88";
    ctx.lineWidth = 3;

    ctx.strokeRect(x, y, w, h);

    // objek
    if (shape === "SILINDER") {

        drawCylinder(cx, cy, Math.min(w,h) / 3, h / 2);

    }

    if (shape === "SFERA") {

        drawSphere(cx, cy, Math.min(w,h) / 3);

    }

    if (shape === "KUBOID") {

        drawCuboid(cx, cy, Math.min(w,h) / 2);

    }

}


// ===============================
// SILINDER
// ===============================

function drawCylinder(cx, cy, radius, height) {

    ctx.save();

    ctx.translate(cx, cy);

    ctx.rotate(rotationY * Math.PI / 180);

    ctx.strokeStyle = "#00ffff";
    ctx.lineWidth = 5;

    const ry = radius * 0.35;

    // atas
    ctx.beginPath();

    ctx.ellipse(
        0,
        -height / 2,
        radius,
        ry,
        rotationX * Math.PI / 180,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    // badan
    ctx.beginPath();

    ctx.moveTo(-radius, -height / 2);
    ctx.lineTo(-radius, height / 2);

    ctx.moveTo(radius, -height / 2);
    ctx.lineTo(radius, height / 2);

    ctx.stroke();


    // bawah
    ctx.beginPath();

    ctx.ellipse(
        0,
        height / 2,
        radius,
        ry,
        rotationX * Math.PI / 180,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();

}


// ===============================
// SFERA
// ===============================

function drawSphere(cx, cy, radius) {

    ctx.save();

    ctx.translate(cx, cy);

    ctx.rotate(rotationY * Math.PI / 180);

    ctx.strokeStyle = "#ffff00";
    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    // garisan melintang
    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        radius,
        radius * 0.35,
        rotationX * Math.PI / 180,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    // garisan menegak
    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        radius * 0.35,
        radius,
        rotationY * Math.PI / 180,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();

}


// ===============================
// KUBOID
// ===============================

function drawCuboid(cx, cy, size) {

    ctx.save();

    ctx.translate(cx, cy);

    const angleX = rotationX * Math.PI / 180;
    const angleY = rotationY * Math.PI / 180;

    ctx.strokeStyle = "#ff66ff";
    ctx.lineWidth = 5;

    const depth = size * 0.35;

    // depan
    ctx.strokeRect(
        -size / 2,
        -size / 2,
        size,
        size
    );


    // belakang
    ctx.strokeRect(
        -size / 2 + depth * Math.cos(angleY),
        -size / 2 + depth * Math.sin(angleX),
        size,
        size
    );


    // sambungan
    ctx.beginPath();

    ctx.moveTo(-size/2, -size/2);

    ctx.lineTo(
        -size/2 + depth * Math.cos(angleY),
        -size/2 + depth * Math.sin(angleX)
    );

    ctx.moveTo(size/2, -size/2);

    ctx.lineTo(
        size/2 + depth * Math.cos(angleY),
        -size/2 + depth * Math.sin(angleX)
    );

    ctx.moveTo(-size/2, size/2);

    ctx.lineTo(
        -size/2 + depth * Math.cos(angleY),
        size/2 + depth * Math.sin(angleX)
    );

    ctx.moveTo(size/2, size/2);

    ctx.lineTo(
        size/2 + depth * Math.cos(angleY),
        size/2 + depth * Math.sin(angleX)
    );

    ctx.stroke();

    ctx.restore();

}


// ===============================
// PUTAR DENGAN JARI
// ===============================

canvas.addEventListener("pointerdown", function(e) {

    if (!currentBox) return;

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;

});


canvas.addEventListener("pointermove", function(e) {

    if (!dragging) return;

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    rotationY += dx * 0.8;
    rotationX += dy * 0.8;

    lastX = e.clientX;
    lastY = e.clientY;

});


canvas.addEventListener("pointerup", function() {

    dragging = false;

});


canvas.addEventListener("pointercancel", function() {

    dragging = false;

});


// ===============================
// RESET
// ===============================

function resetRotation() {

    rotationX = 0;
    rotationY = 0;

}


// ===============================
// START
// ===============================

startCamera();

</script>

</body>
</html>
