<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geometry AI AR</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef6ff;
    color: #17324d;
    text-align: center;
}

h1 {
    color: #1565c0;
}

.container {
    width: 95%;
    max-width: 700px;
    margin: auto;
}

.camera-box {
    position: relative;
    background: #111;
    border-radius: 20px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}

button {
    padding: 14px 20px;
    margin: 8px;
    border: none;
    border-radius: 12px;
    background: #1976d2;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.info, .quiz {
    background: white;
    margin: 20px auto;
    padding: 20px;
    border-radius: 18px;
}

.detected {
    font-size: 22px;
    font-weight: bold;
    color: #1565c0;
}

#loading {
    color: #d97706;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>📐 GEOMETRY AI</h1>

<p>
Halakan kamera kepada objek.
</p>

<p id="loading">
🤖 Sedang memuatkan AI...
</p>

<div class="camera-box">

    <video id="video" autoplay playsinline muted></video>

    <canvas id="canvas"></canvas>

</div>

<button id="start">
📷 Mula Kamera
</button>

<div class="info">

    <h2>🔎 Objek Dikesan</h2>

    <div id="detected">
        Belum ada objek.
    </div>

    <div id="confidence"></div>

    <hr>

    <div id="geometry">
        Bentuk geometri akan muncul di sini.
    </div>

</div>


<div class="quiz">

<h2>📝 Kuiz Geometry</h2>

<p>
Bentuk manakah mempunyai
<b>6 sisi, 8 bucu dan 12 rusuk?</b>
</p>

<button onclick="checkAnswer(false)">
A. Sfera
</button>

<button onclick="checkAnswer(true)">
B. Kuboid
</button>

<button onclick="checkAnswer(false)">
C. Silinder
</button>

<button onclick="checkAnswer(false)">
D. Kon
</button>

<p id="quizResult"></p>

</div>

</div>


<!-- TensorFlow -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>

<!-- COCO-SSD -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const detected = document.getElementById("detected");
const confidence = document.getElementById("confidence");
const geometry = document.getElementById("geometry");
const loading = document.getElementById("loading");

let model = null;
let cameraStarted = false;


/* =========================
   MUAT AI
========================= */

async function loadAI() {

    try {

        model = await cocoSsd.load();

        loading.innerHTML =
        "✅ AI sudah bersedia.";

    }

    catch(error) {

        loading.innerHTML =
        "❌ AI gagal dimuatkan.";

        console.error(error);

    }

}

loadAI();


/* =========================
   MULA KAMERA
========================= */

document.getElementById("start")
.addEventListener("click", async function() {

    try {

        const stream =
        await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: {
                    ideal: "environment"
                }
            },

            audio: false

        });

        video.srcObject = stream;

        cameraStarted = true;

        video.onloadedmetadata = function() {

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            detectObjects();

        };

    }

    catch(error) {

        alert(
        "Kamera tidak dapat dibuka. Sila benarkan akses kamera."
        );

        console.error(error);

    }

});


/* =========================
   DETECT OBJECT
========================= */

async function detectObjects() {

    if (!model || !cameraStarted) {

        requestAnimationFrame(detectObjects);

        return;

    }

    const predictions =
    await model.detect(video);


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let best = null;


    for (const prediction of predictions) {

        if (!best ||
            prediction.score > best.score) {

            best = prediction;

        }

    }


    if (best) {

        const name = best.class;
        const score = best.score;


        /* kotak detection */

        if (
            name === "book" ||
            name === "laptop" ||
            name === "keyboard" ||
            name === "cell phone"
        ) {

            showGeometry(
                "📦 KUBOID",
                score,
                "6",
                "8",
                "12"
            );

        }


        /* botol */

        else if (
            name === "bottle" ||
            name === "wine glass" ||
            name === "cup"
        ) {

            showGeometry(
                "🥫 SILINDER",
                score,
                "3",
                "0",
                "2"
            );

        }


        /* bola */

        else if (
            name === "sports ball"
        ) {

            showGeometry(
                "⚽ SFERA",
                score,
                "1",
                "0",
                "0"
            );

        }

        else {

            detected.innerHTML =
                "🤔 " + name;

            confidence.innerHTML =
                "Keyakinan AI: " +
                Math.round(score * 100) +
                "%";

            geometry.innerHTML =
                "Objek ini belum dipetakan kepada bentuk geometri.";

        }


        /* lukis kotak */

        const [x,y,w,h] =
        best.bbox;

        ctx.strokeStyle = "#00ff88";

        ctx.lineWidth = 4;

        ctx.strokeRect(
            x,
            y,
            w,
            h
        );


        ctx.fillStyle = "#00ff88";

        ctx.font = "20px Arial";

        ctx.fillText(
            name +
            " " +
            Math.round(score * 100) +
            "%",
            x,
            Math.max(25,y - 8)
        );

    }

    else {

        detected.innerHTML =
        "🔍 Tiada objek dikesan.";

        confidence.innerHTML = "";

    }


    requestAnimationFrame(detectObjects);

}


/* =========================
   MAKLUMAT GEOMETRI
========================= */

function showGeometry(
    shape,
    score,
    sides,
    vertices,
    edges
) {

    detected.innerHTML =
        "<div class='detected'>" +
        shape +
        "</div>";

    confidence.innerHTML =
        "Keyakinan AI: " +
        Math.round(score * 100) +
        "%";

    geometry.innerHTML = `

        <p>🔵 Bilangan sisi:
        <b>${sides}</b></p>

        <p>🟢 Bilangan bucu:
        <b>${vertices}</b></p>

        <p>🟠 Bilangan rusuk:
        <b>${edges}</b></p>

    `;

}


/* =========================
   KUIZ
========================= */

function checkAnswer(correct) {

    const result =
    document.getElementById("quizResult");

    if (correct) {

        result.innerHTML =
        "🎉 Betul! Kuboid mempunyai 6 sisi, 8 bucu dan 12 rusuk.";

        result.style.color = "green";

    }

    else {

        result.innerHTML =
        "❌ Cuba lagi!";

        result.style.color = "red";

    }

}

</script>

</body>
</html>
