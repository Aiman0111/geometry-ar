<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geometry AR</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

h1 {
    margin: 15px 0;
}

#cameraBox {
    position: relative;
    width: 95%;
    max-width: 700px;
    margin: auto;
    border-radius: 15px;
    overflow: hidden;
    background: black;
}

#video {
    width: 100%;
    display: block;
}

#detectCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#threeCanvas {
    position: absolute;
    width: 220px;
    height: 220px;
    pointer-events: auto;
    touch-action: none;
    display: none;
}

#info {
    width: 90%;
    max-width: 600px;
    margin: 15px auto;
    padding: 18px;
    background: #222;
    border-radius: 15px;
}

#shapeName {
    font-size: 28px;
    margin: 5px;
}

.details {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.detail {
    background: #333;
    padding: 10px 16px;
    border-radius: 10px;
}

#instruction {
    margin-top: 15px;
    color: #ddd;
}

#status {
    margin: 10px;
    color: #aaa;
}
</style>
</head>

<body>

<h1>📐 Geometry AR</h1>

<div id="status">
Memuatkan kamera dan AI...
</div>

<div id="cameraBox">

    <video id="video" autoplay playsinline></video>

    <canvas id="detectCanvas"></canvas>

    <canvas id="threeCanvas"></canvas>

</div>

<div id="info">

    <div id="shapeName">
        Mencari bentuk...
    </div>

    <div class="details">

        <div class="detail">
            Sisi: <b id="sides">-</b>
        </div>

        <div class="detail">
            Bucu: <b id="vertices">-</b>
        </div>

        <div class="detail">
            Rusuk: <b id="edges">-</b>
        </div>

    </div>

    <div id="instruction">
        Halakan kamera kepada objek.
    </div>

</div>


<script>

const video = document.getElementById("video");
const detectCanvas = document.getElementById("detectCanvas");
const detectCtx = detectCanvas.getContext("2d");

const threeCanvas = document.getElementById("threeCanvas");

const shapeName = document.getElementById("shapeName");
const sides = document.getElementById("sides");
const vertices = document.getElementById("vertices");
const edges = document.getElementById("edges");
const instruction = document.getElementById("instruction");
const statusText = document.getElementById("status");

let model;

let renderer;
let scene;
let camera3D;
let object3D;

let currentShape = null;

let targetX = 0;
let targetY = 0;

let dragging = false;
let previousX = 0;
let previousY = 0;


// ==================================================
// THREE.JS
// ==================================================

function setup3D() {

    renderer = new THREE.WebGLRenderer({
        canvas: threeCanvas,
        alpha: true,
        antialias: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(220, 220, false);

    scene = new THREE.Scene();

    camera3D = new THREE.PerspectiveCamera(
        45,
        1,
        0.1,
        100
    );

    camera3D.position.z = 5;

    const light1 = new THREE.DirectionalLight(
        0xffffff,
        2
    );

    light1.position.set(3, 4, 5);

    scene.add(light1);

    const light2 = new THREE.AmbientLight(
        0xffffff,
        1.2
    );

    scene.add(light2);

    animate3D();
}


// ==================================================
// BUAT OBJEK 3D
// ==================================================

function create3DShape(shape) {

    if (!scene) return;

    if (object3D) {

        scene.remove(object3D);

    }

    if (shape === "SILINDER") {

        const geometry =
            new THREE.CylinderGeometry(
                1,
                1,
                2.2,
                48
            );

        const material =
            new THREE.MeshStandardMaterial({
                color: 0x00d9ff,
                transparent: true,
                opacity: 0.78,
                roughness: 0.25,
                metalness: 0.1
            });

        object3D =
            new THREE.Mesh(
                geometry,
                material
            );

    }


    if (shape === "SFERA") {

        const geometry =
            new THREE.SphereGeometry(
                1.25,
                48,
                32
            );

        const material =
            new THREE.MeshStandardMaterial({
                color: 0xffd43b,
                transparent: true,
                opacity: 0.8
            });

        object3D =
            new THREE.Mesh(
                geometry,
                material
            );

    }


    if (shape === "KUBOID") {

        const geometry =
            new THREE.BoxGeometry(
                2.2,
                1.5,
                1.5
            );

        const material =
            new THREE.MeshStandardMaterial({
                color: 0xff66dd,
                transparent: true,
                opacity: 0.78
            });

        object3D =
            new THREE.Mesh(
                geometry,
                material
            );

    }


    if (object3D) {

        scene.add(object3D);

        targetX = 0;
        targetY = 0;

        object3D.rotation.x = 0;
        object3D.rotation.y = 0;

    }

}


// ==================================================
// ANIMASI 3D
// ==================================================

function animate3D() {

    requestAnimationFrame(animate3D);

    if (object3D) {

        object3D.rotation.x +=
            (targetX - object3D.rotation.x) * 0.15;

        object3D.rotation.y +=
            (targetY - object3D.rotation.y) * 0.15;

    }

    renderer.render(
        scene,
        camera3D
    );

}


// ==================================================
// PUTAR DENGAN JARI
// ==================================================

threeCanvas.addEventListener(
    "pointerdown",
    function(event) {

        dragging = true;

        previousX = event.clientX;
        previousY = event.clientY;

        threeCanvas.setPointerCapture(
            event.pointerId
        );

    }
);


threeCanvas.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) return;

        const movementX =
            event.clientX - previousX;

        const movementY =
            event.clientY - previousY;

        targetY += movementX * 0.015;

        targetX += movementY * 0.015;

        previousX = event.clientX;
        previousY = event.clientY;

    }
);


threeCanvas.addEventListener(
    "pointerup",
    function() {

        dragging = false;

    }
);


threeCanvas.addEventListener(
    "pointercancel",
    function() {

        dragging = false;

    }
);


// ==================================================
// CAMERA
// ==================================================

async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },

                audio: false

            });

        video.srcObject = stream;

        await video.play();

        resizeDetectionCanvas();

        statusText.innerText =
            "Memuatkan AI...";

        model =
            await cocoSsd.load();

        statusText.innerText =
            "AI siap. Halakan kamera kepada objek.";

        detectObjects();

    }

    catch(error) {

        statusText.innerText =
            "Kamera tidak dapat dibuka.";

        console.error(error);

    }

}


// ==================================================
// CANVAS KAMERA
// ==================================================

function resizeDetectionCanvas() {

    detectCanvas.width =
        video.videoWidth;

    detectCanvas.height =
        video.videoHeight;

}

video.addEventListener(
    "loadedmetadata",
    resizeDetectionCanvas
);


// ==================================================
// AI DETECTION
// ==================================================

async function detectObjects() {

    if (!model) return;

    const predictions =
        await model.detect(video);

    detectCtx.clearRect(
        0,
        0,
        detectCanvas.width,
        detectCanvas.height
    );


    if (predictions.length > 0) {

        const object =
            predictions[0];

        const shape =
            getShape(object.class);


        if (shape) {

            drawDetection(
                object.bbox
            );

            showShape(
                shape,
                object.score
            );

            position3D(
                object.bbox
            );

        }

    }

    requestAnimationFrame(
        detectObjects
    );

}


// ==================================================
// TUKAR OBJEK KEPADA BENTUK
// ==================================================

function getShape(object) {

    if (
        object === "bottle" ||
        object === "cup" ||
        object === "wine glass" ||
        object === "vase"
    ) {

        return "SILINDER";

    }


    if (object === "sports ball") {

        return "SFERA";

    }


    if (
        object === "book" ||
        object === "laptop" ||
        object === "keyboard" ||
        object === "cell phone" ||
        object === "remote"
    ) {

        return "KUBOID";

    }

    return null;

}


// ==================================================
// PAPAR MAKLUMAT
// ==================================================

function showShape(shape, confidence) {

    shapeName.innerText =
        "🔷 " + shape;


    if (shape === "SILINDER") {

        sides.innerText = "3";
        vertices.innerText = "0";
        edges.innerText = "2";

    }


    if (shape === "SFERA") {

        sides.innerText = "1";
        vertices.innerText = "0";
        edges.innerText = "0";

    }


    if (shape === "KUBOID") {

        sides.innerText = "6";
        vertices.innerText = "8";
        edges.innerText = "12";

    }


    instruction.innerText =
        "👆 Sentuh dan tarik objek 3D untuk memutarkannya";

    if (currentShape !== shape) {

        currentShape = shape;

        create3DShape(shape);

    }

}


// ==================================================
// KOTAK DETECTION
// ==================================================

function drawDetection(box) {

    const x = box[0];
    const y = box[1];
    const w = box[2];
    const h = box[3];


    detectCtx.strokeStyle =
        "#00ff88";

    detectCtx.lineWidth = 4;

    detectCtx.strokeRect(
        x,
        y,
        w,
        h
    );

}


// ==================================================
// LETAK OBJEK 3D
// ==================================================

function position3D(box) {

    const x = box[0];
    const y = box[1];

    const w = box[2];
    const h = box[3];


    const centerX =
        x + w / 2;

    const centerY =
        y + h / 2;


    const scaleX =
        threeCanvas.parentElement.clientWidth /
        detectCanvas.width;

    const scaleY =
        threeCanvas.parentElement.clientHeight /
        detectCanvas.height;


    threeCanvas.style.left =
        (centerX * scaleX - 110) + "px";

    threeCanvas.style.top =
        (centerY * scaleY - 110) + "px";


    threeCanvas.style.display =
        "block";

}


// ==================================================
// MULAKAN
// ==================================================

setup3D();

startCamera();

</script>

</body>
</html>
