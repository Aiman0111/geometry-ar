<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry AI</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef6ff;
    color:#17324d;
    text-align:center;
}

.container{
    width:95%;
    max-width:750px;
    margin:auto;
}

h1{
    color:#1565c0;
}

.camera{
    position:relative;
    width:100%;
    background:#111;
    border-radius:18px;
    overflow:hidden;
}

video{
    width:100%;
    display:block;
}

#detectCanvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
}

button{
    border:0;
    border-radius:12px;
    padding:14px 20px;
    margin:8px;
    background:#1976d2;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.info,.quiz{
    background:white;
    margin:20px 0;
    padding:20px;
    border-radius:18px;
}

.detected{
    font-size:25px;
    font-weight:bold;
    color:#1565c0;
}

.stat{
    font-size:18px;
    margin:8px;
}

#status{
    font-weight:bold;
    margin:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>📐 GEOMETRY AI</h1>

<p>Halakan kamera kepada objek di sekeliling anda.</p>

<div id="status">
🤖 Memuatkan AI...
</div>

<div class="camera">

<video id="video"
       autoplay
       playsinline
       muted></video>

<canvas id="detectCanvas"></canvas>

</div>

<button id="startCamera">
📷 MULA KAMERA
</button>


<div class="info">

<h2>🔎 Bentuk Dikesan</h2>

<div id="detected">
Belum ada objek.
</div>

<div id="confidence"></div>

<hr>

<div id="geometry">
Halakan kamera kepada objek.
</div>

</div>


<div class="quiz">

<h2>📝 Kuiz Geometry</h2>

<div id="question">

Soalan akan muncul selepas bentuk dikesan.

</div>

<div id="answers"></div>

<div id="quizResult"></div>

</div>

</div>


<!-- AI -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>


<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("detectCanvas");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const detected =
document.getElementById("detected");

const confidence =
document.getElementById("confidence");

const geometry =
document.getElementById("geometry");

let model=null;

let running=false;

let lastShape="";


/* =========================
   LOAD AI
========================= */

async function loadAI(){

    try{

        model=await cocoSsd.load();

        status.innerHTML=
        "✅ AI sudah bersedia. Tekan MULA KAMERA.";

    }

    catch(error){

        status.innerHTML=
        "❌ AI gagal dimuatkan.";

        console.log(error);

    }

}

loadAI();


/* =========================
   CAMERA
========================= */

document
.getElementById("startCamera")
.addEventListener("click",async()=>{

    try{

        const stream=
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                }
            },

            audio:false

        });

        video.srcObject=stream;

        running=true;

        status.innerHTML=
        "📷 Kamera aktif. Halakan kepada objek.";

        video.onloadedmetadata=()=>{

            canvas.width=video.videoWidth;

            canvas.height=video.videoHeight;

            detect();

        };

    }

    catch(error){

        status.innerHTML=
        "❌ Kamera tidak dapat dibuka.";

        console.log(error);

    }

});


/* =========================
   OBJECT DETECTION
========================= */

async function detect(){

    if(!running || !model){

        requestAnimationFrame(detect);

        return;

    }


    const predictions=
    await model.detect(video);


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let best=null;


    for(const p of predictions){

        if(!best || p.score>best.score){

            best=p;

        }

    }


    if(best){

        const objectName=
        best.class;

        const score=
        best.score;


        drawBox(best);


        const shape=
        convertToShape(objectName);


        if(shape){

            showShape(
                shape,
                objectName,
                score
            );

        }

        else{

            detected.innerHTML=
            "🤔 "+objectName;

            confidence.innerHTML=
            "Keyakinan AI: "+
            Math.round(score*100)+"%";

            geometry.innerHTML=
            "Objek ini belum dipetakan kepada bentuk geometri.";

        }

    }

    else{

        detected.innerHTML=
        "🔍 Tiada objek dikesan.";

        confidence.innerHTML="";

    }


    requestAnimationFrame(detect);

}


/* =========================
   MAP OBJECT → GEOMETRY
========================= */

function convertToShape(object){

    object=object.toLowerCase();


    /* SILINDER */

    if(
        object==="bottle" ||
        object==="cup" ||
        object==="wine glass" ||
        object==="vase"
    ){

        return "silinder";

    }


    /* SFERA */

    if(
        object==="sports ball"
    ){

        return "sfera";

    }


    /* KUBOID */

    if(
        object==="book" ||
        object==="laptop" ||
        object==="keyboard" ||
        object==="cell phone" ||
        object==="remote"
    ){

        return "kuboid";

    }


    return null;

}


/* =========================
   PAPAR BENTUK
========================= */

function showShape(
    shape,
    objectName,
    score
){

    let name="";
    let sides="";
    let vertices="";
    let edges="";
    let emoji="";


    if(shape==="silinder"){

        name="SILINDER";

        emoji="🥫";

        sides="3";

        vertices="0";

        edges="2";

    }


    if(shape==="sfera"){

        name="SFERA";

        emoji="⚽";

        sides="1";

        vertices="0";

        edges="0";

    }


    if(shape==="kuboid"){

        name="KUBOID";

        emoji="📦";

        sides="6";

        vertices="8";

        edges="12";

    }


    detected.innerHTML=
    `<div class="detected">
    ${emoji} ${name}
    </div>`;


    confidence.innerHTML=
    `AI mengesan: <b>${objectName}</b>
    (${Math.round(score*100)}%)`;


    geometry.innerHTML=`

    <div class="stat">
    🔵 Sisi: <b>${sides}</b>
    </div>

    <div class="stat">
    🟢 Bucu: <b>${vertices}</b>
    </div>

    <div class="stat">
    🟠 Rusuk: <b>${edges}</b>
    </div>

    `;


    if(lastShape!==shape){

        lastShape=shape;

        createQuiz(shape);

    }

}


/* =========================
   DRAW DETECTION BOX
========================= */

function drawBox(prediction){

    const x=
    prediction.bbox[0];

    const y=
    prediction.bbox[1];

    const w=
    prediction.bbox[2];

    const h=
    prediction.bbox[3];


    ctx.strokeStyle="#00ff88";

    ctx.lineWidth=5;

    ctx.strokeRect(
        x,
        y,
        w,
        h
    );


    ctx.fillStyle="#00ff88";

    ctx.font="bold 20px Arial";

    ctx.fillText(
        prediction.class+
        " "+
        Math.round(prediction.score*100)+"%",
        x,
        Math.max(25,y-8)
    );

}


/* =========================
   QUIZ
========================= */

function createQuiz(shape){

    const question=
    document.getElementById("question");

    const answers=
    document.getElementById("answers");

    document.getElementById(
        "quizResult"
    ).innerHTML="";


    if(shape==="silinder"){

        question.innerHTML=
        "🥫 Berapakah bilangan bucu pada silinder?";

        answers.innerHTML=`

        <button onclick="quiz(false)">A. 2</button>

        <button onclick="quiz(true)">B. 0</button>

        <button onclick="quiz(false)">C. 4</button>

        `;

    }


    if(shape==="sfera"){

        question.innerHTML=
        "⚽ Berapakah bilangan bucu pada sfera?";

        answers.innerHTML=`

        <button onclick="quiz(true)">A. 0</button>

        <button onclick="quiz(false)">B. 2</button>

        <button onclick="quiz(false)">C. 4</button>

        `;

    }


    if(shape==="kuboid"){

        question.innerHTML=
        "📦 Berapakah bilangan sisi pada kuboid?";

        answers.innerHTML=`

        <button onclick="quiz(false)">A. 4</button>

        <button onclick="quiz(true)">B. 6</button>

        <button onclick="quiz(false)">C. 8</button>

        <button onclick="quiz(false)">D. 12</button>

        `;

    }

}


function quiz(correct){

    const result=
    document.getElementById(
        "quizResult"
    );


    if(correct){

        result.innerHTML=
        "🎉 BETUL! Tahniah!";

        result.style.color="green";

    }

    else{

        result.innerHTML=
        "❌ Salah. Cuba lagi.";

        result.style.color="red";

    }

}

</script>

</body>
</html>
