<!DOCTYPE html>
<html lang="ms">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Geometry AR - Prisma</title>

<!-- AI -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<!-- 3D -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
    text-align: center;
}

h1 {
    margin: 15px 0 5px;
    color: #174ea6;
}

#status {
    margin: 8px;
    color: #555;
}

#cameraBox {
    position: relative;
    width: 95%;
    max-width: 700px;
    margin: auto;
    overflow: hidden;
    border-radius: 18px;
    background: black;
}

#video {
    width: 100%;
    display: block;
}

#detectCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#threeCanvas {
    position: absolute;

    width: 240px;
    height: 240px;

    display: none;

    touch-action: none;
    pointer-events: auto;
}

#info {
    width: 92%;
    max-width: 650px;
    margin: 15px auto;
    padding: 18px;

    background: white;

    border-radius: 18px;

    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

#shapeName {
    font-size: 28px;
    font-weight: bold;
    color: #174ea6;

    margin-bottom: 10px;
}

#prismaStatus {
    font-size: 20px;
    font-weight: bold;

    margin-bottom: 15px;
}

.details {
    display: grid;

    grid-template-columns:
    repeat(2, 1fr);

    gap: 10px;
}

.detail {
    background: #eef3f8;

    padding: 12px;

    border-radius: 12px;

    font-size: 17px;
}

.detail b {
    display: block;

    font-size: 25px;

    margin-top: 4px;

    color: #174ea6;
}

#tapakInfo {
    margin-top: 15px;

    padding: 12px;

    background: #fff7c2;

    border-radius: 12px;

    font-size: 17px;
}

#criteria {
    margin-top: 15px;

    text-align: left;

    padding: 15px;

    background: #f2f8e9;

    border-radius: 12px;

    line-height: 1.6;
}

#instruction {
    margin-top: 15px;

    font-weight: bold;

    color: #444;
}

button {
    border: none;

    padding: 12px 20px;

    margin: 8px;

    border-radius: 12px;

    font-size: 16px;

    background: #174ea6;

    color: white;

    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

</style>

</head>


<body>

<h1>📐 Geometry AR</h1>

<div id="status">
Memuatkan kamera...
</div>


<div id="cameraBox">

    <video
        id="video"
        autoplay
        playsinline>
    </video>

    <canvas
        id="detectCanvas">
    </canvas>

    <canvas
        id="threeCanvas">
    </canvas>

</div>


<div id="info">

    <div id="shapeName">
        Mencari bentuk...
    </div>


    <div id="prismaStatus">
        -
    </div>


    <div class="details">

        <div class="detail">
            Permukaan rata
            <b id="flatSurfaces">-</b>
        </div>


        <div class="detail">
            Permukaan melengkung
            <b id="curvedSurfaces">-</b>
        </div>


        <div class="detail">
            Bucu
            <b id="vertices">-</b>
        </div>


        <div class="detail">
            Tepi
            <b id="edges">-</b>
        </div>

    </div>


    <div id="tapakInfo">
        Tapak: -
    </div>


    <div id="criteria">
        <b>Ciri bentuk:</b>
        <div id="criteriaText">
            -
        </div>
    </div>


    <div id="instruction">
        Halakan kamera kepada objek.
    </div>

</div>


<button onclick="resetRotation()">
🔄 Reset Putaran
</button>


<script>


// =====================================================
// ELEMENT
// =====================================================

const video =
document.getElementById("video");

const detectCanvas =
document.getElementById("detectCanvas");

const detectCtx =
detectCanvas.getContext("2d");

const threeCanvas =
document.getElementById("threeCanvas");

const statusText =
document.getElementById("status");


// =====================================================
// MAKLUMAT
// =====================================================

const shapeName =
document.getElementById("shapeName");

const prismaStatus =
document.getElementById("prismaStatus");

const flatSurfaces =
document.getElementById("flatSurfaces");

const curvedSurfaces =
document.getElementById("curvedSurfaces");

const vertices =
document.getElementById("vertices");

const edges =
document.getElementById("edges");

const tapakInfo =
document.getElementById("tapakInfo");

const criteriaText =
document.getElementById("criteriaText");

const instruction =
document.getElementById("instruction");


// =====================================================
// AI
// =====================================================

let model;

let currentShape = null;


// =====================================================
// THREE.JS
// =====================================================

let renderer;

let scene;

let camera3D;

let object3D;


// =====================================================
// PUTARAN
// =====================================================

let rotationX = 0;

let rotationY = 0;

let dragging = false;

let previousX = 0;

let previousY = 0;


// =====================================================
// MAKLUMAT BENTUK
// =====================================================

const shapeData = {

    "PRISMA SEGI TIGA": {

        flat: 5,

        curved: 0,

        vertices: 6,

        edges: 9,

        tapak:
        "2 tapak berbentuk segi tiga",

        prisma: true,

        criteria:
        "✓ 5 permukaan rata<br>" +
        "✓ 2 tapak yang sama bentuk dan saiz<br>" +
        "✓ Tiada permukaan melengkung"

    },


    "PRISMA SEGI EMPAT SAMA": {

        flat: 6,

        curved: 0,

        vertices: 8,

        edges: 12,

        tapak:
        "2 tapak berbentuk segi empat sama",

        prisma: true,

        criteria:
        "✓ 6 permukaan rata<br>" +
        "✓ 2 tapak yang sama bentuk dan saiz<br>" +
        "✓ Tiada permukaan melengkung"

    },


    "PRISMA SEGI EMPAT TEPAT": {

        flat: 6,

        curved: 0,

        vertices: 8,

        edges: 12,

        tapak:
        "2 tapak berbentuk segi empat tepat",

        prisma: true,

        criteria:
        "✓ 6 permukaan rata<br>" +
        "✓ 2 tapak yang sama bentuk dan saiz<br>" +
        "✓ Tiada permukaan melengkung"

    },


    "SILINDER": {

        flat: 2,

        curved: 1,

        vertices: 0,

        edges: 2,

        tapak:
        "2 tapak berbentuk bulatan",

        prisma: false,

        criteria:
        "✗ Mempunyai permukaan melengkung<br>" +
        "✗ Bukan prisma"

    },


    "SFERA": {

        flat: 0,

        curved: 1,

        vertices: 0,

        edges: 0,

        tapak:
        "Tiada tapak",

        prisma: false,

        criteria:
        "✗ Tiada permukaan rata<br>" +
        "✗ Mempunyai permukaan melengkung<br>" +
        "✗ Bukan prisma"

    },


    "KON": {

        flat: 1,

        curved: 1,

        vertices: 1,

        edges: 1,

        tapak:
        "1 tapak berbentuk bulatan",

        prisma: false,

        criteria:
        "✗ Mempunyai permukaan melengkung<br>" +
        "✗ Hanya mempunyai 1 tapak<br>" +
        "✗ Bukan prisma"

    },


    "PIRAMID": {

        flat: 5,

        curved: 0,

        vertices: 5,

        edges: 8,

        tapak:
        "1 tapak",

        prisma: false,

        criteria:
        "✗ Hanya mempunyai 1 tapak<br>" +
        "✗ Permukaan sisi bertemu pada satu bucu<br>" +
        "✗ Bukan prisma"

    }

};


// =====================================================
// THREE.JS SETUP
// =====================================================

function setup3D() {

    renderer =
    new THREE.WebGLRenderer({

        canvas: threeCanvas,

        alpha: true,

        antialias: true

    });


    renderer.setPixelRatio(
        window.devicePixelRatio
    );


    renderer.setSize(
        240,
        240,
        false
    );


    scene =
    new THREE.Scene();


    camera3D =
    new THREE.PerspectiveCamera(

        45,

        1,

        0.1,

        100

    );


    camera3D.position.z = 5;


    const light =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );


    light.position.set(
        3,
        4,
        5
    );


    scene.add(light);


    const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1.3
    );


    scene.add(ambient);


    animate3D();

}


// =====================================================
// BINA BENTUK 3D
// =====================================================

function create3DShape(shape) {

    if (!scene) return;


    if (object3D) {

        scene.remove(object3D);

    }


    let geometry;

    let material;


    material =
    new THREE.MeshStandardMaterial({

        color:
        shape.includes("PRISMA")
        ? 0x36a9e1
        : shape === "SILINDER"
        ? 0x42d6a4
        : 0xffc83d,

        transparent: true,

        opacity: 0.82,

        roughness: 0.3

    });


    // PRISMA SEGI TIGA
    if (
        shape === "PRISMA SEGI TIGA"
    ) {

        geometry =
        new THREE.CylinderGeometry(

            1.2,

            1.2,

            2.2,

            3

        );

        geometry.rotateY(
            Math.PI / 2
        );

    }


    // PRISMA SEGI EMPAT SAMA
    if (
        shape === "PRISMA SEGI EMPAT SAMA"
    ) {

        geometry =
        new THREE.BoxGeometry(

            2,

            2,

            2

        );

    }


    // PRISMA SEGI EMPAT TEPAT
    if (
        shape === "PRISMA SEGI EMPAT TEPAT"
    ) {

        geometry =
        new THREE.BoxGeometry(

            2.5,

            1.5,

            1.5

        );

    }


    // SILINDER
    if (
        shape === "SILINDER"
    ) {

        geometry =
        new THREE.CylinderGeometry(

            1,

            1,

            2.2,

            48

        );

    }


    // SFERA
    if (
        shape === "SFERA"
    ) {

        geometry =
        new THREE.SphereGeometry(

            1.25,

            48,

            32

        );

    }


    // KON
    if (
        shape === "KON"
    ) {

        geometry =
        new THREE.ConeGeometry(

            1.2,

            2.3,

            48

        );

    }


    if (!geometry) return;


    object3D =
    new THREE.Mesh(

        geometry,

        material

    );


    scene.add(object3D);


    rotationX = 0;

    rotationY = 0;

}


// =====================================================
// ANIMASI
// =====================================================

function animate3D() {

    requestAnimationFrame(
        animate3D
    );


    if (object3D) {

        object3D.rotation.x +=
        (
            rotationX -
            object3D.rotation.x
        ) * 0.15;


        object3D.rotation.y +=
        (
            rotationY -
            object3D.rotation.y
        ) * 0.15;

    }


    renderer.render(
        scene,
        camera3D
    );

}


// =====================================================
// PUTAR 3D DENGAN JARI
// =====================================================

threeCanvas.addEventListener(
    "pointerdown",
    function(event) {

        dragging = true;

        previousX =
        event.clientX;

        previousY =
        event.clientY;

        threeCanvas.setPointerCapture(
            event.pointerId
        );

    }
);


threeCanvas.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) return;


        const dx =
        event.clientX -
        previousX;


        const dy =
        event.clientY -
        previousY;


        rotationY +=
        dx * 0.015;


        rotationX +=
        dy * 0.015;


        previousX =
        event.clientX;


        previousY =
        event.clientY;

    }
);


threeCanvas.addEventListener(
    "pointerup",
    function() {

        dragging = false;

    }
);


threeCanvas.addEventListener(
    "pointercancel",
    function() {

        dragging = false;

    }
);


// =====================================================
// RESET
// =====================================================

function resetRotation() {

    rotationX = 0;

    rotationY = 0;

}


// =====================================================
// CAMERA
// =====================================================

async function startCamera() {

    try {

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video: {

                facingMode: {

                    ideal:
                    "environment"

                }

            },

            audio: false

        });


        video.srcObject =
        stream;


        await video.play();


        resizeCanvas();


        statusText.innerText =
        "Memuatkan AI...";


        model =
        await cocoSsd.load();


        statusText.innerText =
        "AI sudah siap. Halakan kamera kepada objek.";


        detectObjects();

    }

    catch(error) {

        console.error(error);


        statusText.innerText =
        "Kamera tidak dapat dibuka.";

    }

}


// =====================================================
// SAIZ CANVAS
// =====================================================

function resizeCanvas() {

    detectCanvas.width =
    video.videoWidth;

    detectCanvas.height =
    video.videoHeight;

}


video.addEventListener(
    "loadedmetadata",
    resizeCanvas
);


// =====================================================
// AI
// =====================================================

async function detectObjects() {

    if (!model) return;


    const predictions =
    await model.detect(video);


    detectCtx.clearRect(

        0,

        0,

        detectCanvas.width,

        detectCanvas.height

    );


    if (
        predictions.length > 0
    ) {

        const object =
        predictions[0];


        const shape =
        getShape(
            object.class
        );


        if (shape) {

            drawDetection(
                object.bbox
            );


            showShape(
                shape
            );


            position3D(
                object.bbox
            );

        }

    }


    requestAnimationFrame(
        detectObjects
    );

}


// =====================================================
// TENTUKAN BENTUK
// =====================================================

function getShape(object) {


    // BOTOL / CAWAN
    // → SILINDER

    if (

        object === "bottle" ||

        object === "cup" ||

        object === "wine glass" ||

        object === "vase"

    ) {

        return "SILINDER";

    }


    // BOLA
    // → SFERA

    if (
        object === "sports ball"
    ) {

        return "SFERA";

    }


    // BUKU
    // → PRISMA SEGI EMPAT TEPAT

    if (
        object === "book"
    ) {

        return "PRISMA SEGI EMPAT TEPAT";

    }


    // LAPTOP
    // → PRISMA SEGI EMPAT TEPAT

    if (
        object === "laptop" ||

        object === "keyboard" ||

        object === "cell phone" ||

        object === "remote"
    ) {

        return "PRISMA SEGI EMPAT TEPAT";

    }


    return null;

}


// =====================================================
// PAPAR MAKLUMAT
// =====================================================

function showShape(shape) {

    const data =
    shapeData[shape];


    if (!data) return;


    shapeName.innerText =
    "🔷 " + shape;


    if (data.prisma) {

        prismaStatus.innerText =
        "✅ PRISMA";


        prismaStatus.style.color =
        "#16803c";

    }

    else {

        prismaStatus.innerText =
        "❌ BUKAN PRISMA";


        prismaStatus.style.color =
        "#c62828";

    }


    flatSurfaces.innerText =
    data.flat;


    curvedSurfaces.innerText =
    data.curved;


    vertices.innerText =
    data.vertices;


    edges.innerText =
    data.edges;


    tapakInfo.innerHTML =
    "<b>Tapak:</b> " +
    data.tapak;


    criteriaText.innerHTML =
    data.criteria;


    instruction.innerText =
    "👆 Sentuh model 3D dan tarik untuk memutarkannya";


    if (
        currentShape !== shape
    ) {

        currentShape =
        shape;


        create3DShape(
            shape
        );

    }

}


// =====================================================
// KOTAK AI
// =====================================================

function drawDetection(box) {

    const x = box[0];

    const y = box[1];

    const w = box[2];

    const h = box[3];


    detectCtx.strokeStyle =
    "#00ff88";


    detectCtx.lineWidth =
    4;


    detectCtx.strokeRect(

        x,

        y,

        w,

        h

    );

}


// =====================================================
// LETAK MODEL 3D
// =====================================================

function position3D(box) {

    const x = box[0];

    const y = box[1];

    const w = box[2];

    const h = box[3];


    const centerX =
    x + w / 2;


    const centerY =
    y + h / 2;


    const displayWidth =
    video.clientWidth;


    const displayHeight =
    video.clientHeight;


    const scaleX =
    displayWidth /
    detectCanvas.width;


    const scaleY =
    displayHeight /
    detectCanvas.height;


    threeCanvas.style.left =

    (
        centerX * scaleX -
        120
    ) + "px";


    threeCanvas.style.top =

    (
        centerY * scaleY -
        120
    ) + "px";


    threeCanvas.style.display =
    "block";

}


// =====================================================
// MULA
// =====================================================

setup3D();

startCamera();

</script>

</body>
</html>
