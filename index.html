<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Geometry AI AR</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef6ff;
    color:#17324d;
    text-align:center;
}

.container{
    width:95%;
    max-width:800px;
    margin:auto;
}

h1{
    color:#1565c0;
}

.camera{
    position:relative;
    width:100%;
    background:#111;
    border-radius:20px;
    overflow:hidden;
}

#video{
    width:100%;
    display:block;
}

#canvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
}

button{
    padding:13px 18px;
    margin:6px;
    border:0;
    border-radius:12px;
    background:#1976d2;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.info,.quiz{
    background:white;
    margin:20px 0;
    padding:20px;
    border-radius:18px;
}

.shape{
    font-size:28px;
    font-weight:bold;
    color:#1565c0;
}

.stat{
    font-size:18px;
    margin:8px;
}

#status{
    font-weight:bold;
    margin:12px;
}

</style>
</head>

<body>

<div class="container">

<h1>📐 GEOMETRY AI AR</h1>

<p>Halakan kamera kepada objek.</p>

<div id="status">
🤖 Memuatkan AI...
</div>

<div class="camera">

<video id="video"
       autoplay
       playsinline
       muted></video>

<canvas id="canvas"></canvas>

</div>

<button id="start">
📷 MULA KAMERA
</button>

<div class="info">

<h2>🔎 Bentuk Dikesan</h2>

<div id="shape">
Belum ada bentuk.
</div>

<div id="confidence"></div>

<div id="geometry">
Halakan kamera kepada objek.
</div>

</div>


<div class="quiz">

<h2>📝 KUIZ</h2>

<div id="question">
Soalan akan muncul apabila bentuk dikesan.
</div>

<div id="answers"></div>

<div id="result"></div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>


<script>

const video=
document.getElementById("video");

const canvas=
document.getElementById("canvas");

const ctx=
canvas.getContext("2d");

const status=
document.getElementById("status");

let model=null;

let running=false;

let currentShape="";


/* =========================
   LOAD AI
========================= */

async function loadAI(){

    try{

        model=
        await cocoSsd.load();

        status.innerHTML=
        "✅ AI bersedia. Tekan MULA KAMERA.";

    }

    catch(error){

        status.innerHTML=
        "❌ AI gagal dimuatkan.";

        console.log(error);

    }

}

loadAI();


/* =========================
   START CAMERA
========================= */

document
.getElementById("start")
.addEventListener("click",async()=>{

    try{

        const stream=
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                }
            },

            audio:false

        });

        video.srcObject=stream;

        running=true;

        status.innerHTML=
        "📷 Kamera aktif.";

        video.onloadedmetadata=()=>{

            canvas.width=
            video.videoWidth;

            canvas.height=
            video.videoHeight;

            detect();

        };

    }

    catch(error){

        status.innerHTML=
        "❌ Kamera tidak dapat dibuka.";

        console.log(error);

    }

});


/* =========================
   DETECTION
========================= */

async function detect(){

    if(!model || !running){

        requestAnimationFrame(detect);

        return;

    }


    const predictions=
    await model.detect(video);


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let best=null;


    for(const p of predictions){

        if(!best ||
           p.score>best.score){

            best=p;

        }

    }


    if(best && best.score>0.45){

        const object=
        best.class;

        const score=
        best.score;

        const shape=
        getShape(object);


        drawDetection(
            best,
            shape
        );


        if(shape){

            showShape(
                shape,
                object,
                score,
                best.bbox
            );

        }

        else{

            document
            .getElementById("shape")
            .innerHTML=
            "🤔 "+object;

            document
            .getElementById("confidence")
            .innerHTML=
            "Keyakinan: "+
            Math.round(score*100)+"%";

        }

    }

    else{

        document
        .getElementById("shape")
        .innerHTML=
        "🔍 Tiada objek.";

        document
        .getElementById("confidence")
        .innerHTML="";

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }


    requestAnimationFrame(detect);

}


/* =========================
   OBJECT → SHAPE
========================= */

function getShape(object){

    if(
        object==="bottle" ||
        object==="cup" ||
        object==="wine glass" ||
        object==="vase"
    ){

        return "silinder";

    }


    if(
        object==="sports ball"
    ){

        return "sfera";

    }


    if(
        object==="book" ||
        object==="laptop" ||
        object==="keyboard" ||
        object==="cell phone" ||
        object==="remote"
    ){

        return "kuboid";

    }


    return null;

}


/* =========================
   DRAW DETECTION
========================= */

function drawDetection(
    prediction,
    shape
){

    const x=
    prediction.bbox[0];

    const y=
    prediction.bbox[1];

    const w=
    prediction.bbox[2];

    const h=
    prediction.bbox[3];


    ctx.strokeStyle=
    "#00ff88";

    ctx.lineWidth=4;

    ctx.strokeRect(
        x,
        y,
        w,
        h
    );


    ctx.fillStyle=
    "#00ff88";

    ctx.font=
    "bold 18px Arial";

    ctx.fillText(
        prediction.class,
        x,
        Math.max(22,y-7)
    );


    /* MODEL 3D */

    if(shape){

        draw3DShape(
            shape,
            x,
            y,
            w,
            h
        );

    }

}


/* =========================
   3D SHAPE
========================= */

function draw3DShape(
    shape,
    x,
    y,
    w,
    h
){

    const cx=
    x+w/2;

    const cy=
    y+h/2;


    if(shape==="silinder"){

        drawCylinder(
            cx,
            cy,
            Math.min(w,h)*0.32,
            h*0.8
        );

    }


    if(shape==="sfera"){

        drawSphere(
            cx,
            cy,
            Math.min(w,h)*0.38
        );

    }


    if(shape==="kuboid"){

        drawCuboid(
            cx,
            cy,
            Math.min(w,h)*0.35
        );

    }

}


/* =========================
   CYLINDER
========================= */

function drawCylinder(
    cx,
    cy,
    radius,
    height
){

    const top=
    cy-height/2;

    const bottom=
    cy+height/2;


    ctx.fillStyle=
    "rgba(0,180,255,0.35)";

    ctx.strokeStyle=
    "#00ffff";

    ctx.lineWidth=4;


    ctx.beginPath();

    ctx.ellipse(
        cx,
        top,
        radius,
        radius*0.32,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.stroke();


    ctx.fillRect(
        cx-radius,
        top,
        radius*2,
        height
    );


    ctx.beginPath();

    ctx.moveTo(
        cx-radius,
        top
    );

    ctx.lineTo(
        cx-radius,
        bottom
    );

    ctx.moveTo(
        cx+radius,
        top
    );

    ctx.lineTo(
        cx+radius,
        bottom
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.ellipse(
        cx,
        bottom,
        radius,
        radius*0.32,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.fillStyle="white";

    ctx.font=
    "bold 18px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "SILINDER",
        cx,
        cy+7
    );

}


/* =========================
   SPHERE
========================= */

function drawSphere(
    cx,
    cy,
    radius
){

    const gradient=
    ctx.createRadialGradient(
        cx-radius*0.35,
        cy-radius*0.35,
        5,
        cx,
        cy,
        radius
    );


    gradient.addColorStop(
        0,
        "rgba(255,255,255,0.8)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,150,255,0.45)"
    );


    ctx.fillStyle=
    gradient;

    ctx.strokeStyle=
    "#00ffff";

    ctx.lineWidth=4;


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.stroke();


    ctx.fillStyle="white";

    ctx.font=
    "bold 18px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "SFERA",
        cx,
        cy+7
    );

}


/* =========================
   CUBOID
========================= */

function drawCuboid(
    cx,
    cy,
    size
){

    const offset=
    size*0.45;


    ctx.fillStyle=
    "rgba(0,150,255,0.35)";

    ctx.strokeStyle=
    "#00ffff";

    ctx.lineWidth=4;


    ctx.beginPath();

    ctx.rect(
        cx-size,
        cy-size,
        size*2,
        size*1.5
    );

    ctx.fill();

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        cx-size,
        cy-size
    );

    ctx.lineTo(
        cx-size+offset,
        cy-size-offset
    );

    ctx.lineTo(
        cx+size+offset,
        cy-size-offset
    );

    ctx.lineTo(
        cx+size,
        cy-size
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        cx+size,
        cy-size
    );

    ctx.lineTo(
        cx+size+offset,
        cy-size-offset
    );

    ctx.lineTo(
        cx+size+offset,
        cy+size*0.5-offset
    );

    ctx.lineTo(
        cx+size,
        cy+size*0.5
    );

    ctx.stroke();


    ctx.fillStyle="white";

    ctx.font=
    "bold 18px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "KUBOID",
        cx,
        cy
    );

}


/* =========================
   INFO
========================= */

function showShape(
    shape,
    object,
    score,
    bbox
){

    let name="";
    let emoji="";
    let sides="";
    let vertices="";
    let edges="";


    if(shape==="silinder"){

        name="SILINDER";

        emoji="🥫";

        sides="3";

        vertices="0";

        edges="2";

    }


    if(shape==="sfera"){

        name="SFERA";

        emoji="⚽";

        sides="1";

        vertices="0";

        edges="0";

    }


    if(shape==="kuboid"){

        name="KUBOID";

        emoji="📦";

        sides="6";

        vertices="8";

        edges="12";

    }


    document
    .getElementById("shape")
    .innerHTML=
    `<div class="shape">
    ${emoji} ${name}
    </div>`;


    document
    .getElementById("confidence")
    .innerHTML=
    `AI mengesan <b>${object}</b> —
    ${Math.round(score*100)}%`;


    document
    .getElementById("geometry")
    .innerHTML=`

    <div class="stat">
    🔵 Sisi: <b>${sides}</b>
    </div>

    <div class="stat">
    🟢 Bucu: <b>${vertices}</b>
    </div>

    <div class="stat">
    🟠 Rusuk: <b>${edges}</b>
    </div>

    `;


    if(currentShape!==shape){

        currentShape=shape;

        createQuiz(shape);

    }

}


/* =========================
   QUIZ
========================= */

function createQuiz(shape){

    const question=
    document.getElementById(
        "question"
    );

    const answers=
    document.getElementById(
        "answers"
    );


    if(shape==="silinder"){

        question.innerHTML=
        "🥫 Berapakah bilangan bucu silinder?";

        answers.innerHTML=`

        <button onclick="check(true)">
        A. 0
        </button>

        <button onclick="check(false)">
        B. 2
        </button>

        <button onclick="check(false)">
        C. 4
        </button>

        `;

    }


    if(shape==="sfera"){

        question.innerHTML=
        "⚽ Berapakah bilangan bucu sfera?";

        answers.innerHTML=`

        <button onclick="check(true)">
        A. 0
        </button>

        <button onclick="check(false)">
        B. 2
        </button>

        `;

    }


    if(shape==="kuboid"){

        question.innerHTML=
        "📦 Berapakah bilangan sisi kuboid?";

        answers.innerHTML=`

        <button onclick="check(false)">
        A. 4
        </button>

        <button onclick="check(true)">
        B. 6
        </button>

        <button onclick="check(false)">
        C. 8
        </button>

        <button onclick="check(false)">
        D. 12
        </button>

        `;

    }

}


function check(correct){

    const result=
    document.getElementById(
        "result"
    );


    if(correct){

        result.innerHTML=
        "🎉 BETUL!";

        result.style.color=
        "green";

    }

    else{

        result.innerHTML=
        "❌ Salah. Cuba lagi.";

        result.style.color=
        "red";

    }

}

</script>

</body>
</html>
